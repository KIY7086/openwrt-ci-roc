name: M2-AP-LibWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/openwrt-6.x.git
      repo_branch: 25.12-nss
      config_file: configs/M2.config
      general_config_file: configs/M2.General.config
      firmware_tag: M2
      kernel_file: kernel-6.12
      artifact_prefix: ZN-M2.AP
      # 单设备构建的 manifest 带 PROFILE_SANITIZED 设备名后缀（zn_m2）
      manifest_file: libwrt-qualcommax-ipq60xx-zn_m2.manifest
      delete_old_workflows: true
      release_summary: >-
        这是兆能M2（ZN-M2，IPQ6000/256MB/AX1800）精简固件：仅精简固件本身（ath11k 256MB小内存档、
        关闭kallsyms、zram防OOM、完整版wpad支持802.11r），NSS加速完整保留；
        无任何内置定制，出厂默认行为（默认地址192.168.2.1，DHCP/无线等均为默认，无线radio出厂关闭，
        首次使用在LuCI中启用），ath11k全套无线驱动已内置，详见M2.config和M2.General.config。
