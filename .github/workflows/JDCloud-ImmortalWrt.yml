name: JDCloud-ImmortalWrt

on:
  workflow_dispatch:
  workflow_call:
  # schedule:
  #   - cron: "0 18 * * *"

permissions:
  contents: read
  actions: read

jobs:
  Build:
    uses: ./.github/workflows/Build-OpenWrt.yml
    permissions:
      contents: write
      actions: write
    with:
      repo_url: https://github.com/laipeng668/immortalwrt.git
      repo_branch: openwrt-25.12
      config_file: configs/JDCloud.config
      firmware_tag: JDCloud
      kernel_file: kernel-6.18
      artifact_prefix: Arthur
      manifest_file: immortalwrt-qualcommax-ipq60xx.manifest
      delete_old_workflows: true
      release_summary: >-
        这是京东云亚瑟(RE-SS-01)开启全功能NSS的6.18内核固件，默认主题为Aurora；代理方案为Nikki(mihomo内核，含luci-app-nikki与中文语言包，不预装PassWall)；系统空间4GiB(rootfs分区，eMMC其余空间保持原样)；完整版wpad支持802.11r快速漫游(与兆能M2组网)；启用zram内存压缩；此外添加了额外的软件包cpufreq、ddns、upnp、wol、samba4、vlmcsd、aria2、autoreboot、uhttpd、frps、frpc、diskman、hd-idle、acme、openlist2、wireguard、watchcat、3cat、gecoosac，并添加了若干工具，具体详见JDCloud.config和General.config。
